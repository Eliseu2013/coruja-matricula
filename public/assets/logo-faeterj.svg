  <text x="92" y="60" font-family="'Plus Jakarta Sans', Arial, Helvetica, sans-serif" font-size="8.5" font-weight="800" fill="#1e293b" letter-spacing="0.5">FACULDADE DE EDUCAÇÃO TECNOLÓGICA</text>
  <text x="92" y="72" font-family="'Plus Jakarta Sans', Arial, Helvetica, sans-serif" font-size="8" font-weight="700" fill="#64748b" letter-spacing="0.5">UNIDADE FERNANDO MOTA &#8226; FAETEC / SECTI</text>
</svg>
