    <path d="M 34,18 L 56,29 L 34,40 L 12,29 Z" fill="url(#corujaGold)"/>
    <path d="M 22,34 L 22,48 C 22,54 46,54 46,48 L 46,34" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="56" y1="29" x2="56" y2="46" stroke="url(#corujaGold)" stroke-width="2"/>
    <circle cx="56" cy="48" r="2.5" fill="url(#corujaGold)"/>
  </g>
  <!-- FAETERJ-Rio Typography -->
